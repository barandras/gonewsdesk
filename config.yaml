# Each source can be toggled independently. At least one enabled source is required.
custom:
  enabled: false # toggle to enable/disable the custom websocket news stream
  # WebSocket URL of a server that pushes JSON news objects (one per text frame).
  url: "ws://127.0.0.1:8765/ws"

stocklabs:
  enabled: true # toggle to enable/disable the stocklabs source
  includeHistorical: true # toggle to fetch historical news in the stream when the app starts

alpaca:
  enabled: false # toggle to enable/disable the alpaca source
  # when enabled, fetches the latest 20 articles from Alpaca's REST news API at startup (before the live WebSocket stream).
  # see https://docs.alpaca.markets/us/reference/news-3
  includeHistorical: true
  # recommended to use a paper account credentials here, for the least privilege principle.
  apiKeyID: "" # alpaca API key ID
  apiKeySecret: "" # alpaca API key secret

filter:
  # keywords to exclude from the news stream.
  # if any of these keywords are found in the news headline, the news will be excluded.
  # case-insensitive substring match.
  excludeKeywords: []
    # - "canada"
    # - "china"
    # - "russia"
  # keywords to include in the news stream.
  # if set, only news items that contain at least one of these keywords in the headline will be included.
  # case-insensitive substring match.
  includeKeywords: []
    # - "iran"
    # - "hormuz"
    # - "trump"
  # keywords to highlight in the news stream.
  # if set, and news items that contain at least one of these keywords in the headline, the news tile will be highlighted.
  # case-insensitive substring match.
  highlightKeywords: []
    # - "strike"
    # - "ceasefire"

debug: false # toggle to enable/disable printing debug logs to the log inspector panel

# When true, regional-indicator flag emoji (two-letter country codes as Unicode flags) are shown as
# a neutral flag plus ASCII letters (e.g. [🏳 US]) so terminals/fonts that break on flag sequences still render cleanly.
# Default is false: keep the original Unicode flag emoji from the feed.
flag-compat: false

ui:
  # if true, tiles show only meta and a single-line headline (no body)
  shortHeadlineOnly: false
  # if true, tile bodies are shortened in the list only; details modal keeps full text
  truncateTileBody: false
  # maximum tile body chars before truncation (used when truncateTileBody is true)
  tileBodyMaxChars: 300
